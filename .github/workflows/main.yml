name: github pages

on:
  repository_dispatch:
    types: [bot_update]

jobs:
  deploy:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout Hugo Files
        uses: actions/checkout@v2
        with:
          repository: ${{ secrets.REPO_HUGO }}
          fetch-depth: 0    # Fetch all history for .GitInfo and .Lastmod

      - name: Checkout Hugo Data
        uses: actions/checkout@v2
        with:
          repository: ${{ secrets.REPO_DATA }}
          path: ./data/

      - name: Remove .git form Data
        run: rm -r ./data/.git/

      - name: Use Node.js 16.x
        uses: actions/setup-node@v1
        with:
          node-version: 16.x
      
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.93.0'
          extended: true
      - run: node update-pages.js

      - name: Build
        run: hugo --minify

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          full_commit_message: Update ${{ github.event.head_commit.id }}
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
